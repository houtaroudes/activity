name: Daily activity log

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Append today's entry
        run: node scripts/log.mjs

      # Stops the run before the commit if a date appears twice, so a bad line
      # never reaches the branch the graph reads from.
      - name: Check for a duplicate day
        run: node scripts/check-log.mjs

      - name: Commit and push
        run: |
          git config user.name "HoutarouDes"
          git config user.email "houtaroudes@gmail.com"
          git add log.jsonl
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Log $(date -u +%Y-%m-%d)"
          git push
